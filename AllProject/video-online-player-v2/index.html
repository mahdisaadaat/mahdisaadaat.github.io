<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Video Player | Mahdi Saadaat</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

background:linear-gradient(135deg,#141E30,#243B55);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;

}

.player{

width:900px;
max-width:100%;
background:#fff;
border-radius:20px;
overflow:hidden;
box-shadow:0 20px 60px rgba(0,0,0,.4);

}

.video-box{

background:#000;

}

video{

width:100%;
display:block;

}

.controls{

padding:20px;

}

.progress{

width:100%;
height:8px;
appearance:none;
margin-bottom:18px;
cursor:pointer;

}

.progress::-webkit-slider-thumb{

appearance:none;
width:18px;
height:18px;
background:#0d6efd;
border-radius:50%;
cursor:pointer;

}

.buttons{

display:flex;
flex-wrap:wrap;
gap:10px;
justify-content:center;

}

button{

border:none;
padding:12px 18px;
border-radius:10px;
background:#0d6efd;
color:#fff;
font-size:15px;
cursor:pointer;
transition:.3s;

}

button:hover{

background:#084298;
transform:translateY(-2px);

}

.info{

display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:15px;
font-size:14px;
color:#555;

}

.volume{

width:140px;

}

@media(max-width:600px){

.buttons{

display:grid;
grid-template-columns:repeat(2,1fr);

}

button{

width:100%;

}

}

</style>

</head>

<body>

<div class="player">

<div class="video-box">

<video id="video" controls>

<source src="https://ir31.uploadb.com/d/s5maoc8g8phe/rnneikj4jhfx3pohk4wdvrwq5gjwshgy75gqbprwkikbxd73qwu26b2dngzusqnhvtxnc4pq/bamdad.khmar-S02E01-720.mp4" type="video/mp4">

</video>

</div>

<div class="controls">

<div class="info">

<div id="time">
00:00 / 00:00
</div>

<input
class="volume"
type="range"
min="0"
max="1"
step="0.01"
value="1"
id="volume">

</div>

<input
type="range"
id="progress"
class="progress"
min="0"
max="100"
value="0">

<div class="buttons">

<button onclick="togglePlay()">▶ Play / Pause</button>

<button onclick="restart()">⟳ Restart</button>

<button onclick="skip(-10)">⏪ 10s</button>

<button onclick="skip(10)">10s ⏩</button>

<button onclick="changeSize(0.8)">Small</button>

<button onclick="changeSize(1)">Normal</button>

<button onclick="changeSize(1.2)">Big</button>

<button onclick="fullscreen()">⛶ Fullscreen</button>

</div>

</div>

</div>

<script>

const video=document.getElementById("video");
const progress=document.getElementById("progress");
const volume=document.getElementById("volume");
const time=document.getElementById("time");

function togglePlay(){

video.paused ? video.play() : video.pause();

}

function restart(){

video.currentTime=0;

}

function skip(sec){

video.currentTime+=sec;

}

function changeSize(scale){

video.style.transform=`scale(${scale})`;
video.style.transition=".3s";

}

function fullscreen(){

if(video.requestFullscreen){

video.requestFullscreen();

}

}

volume.addEventListener("input",()=>{

video.volume=volume.value;

});

video.addEventListener("timeupdate",()=>{

progress.value=(video.currentTime/video.duration)*100||0;

let current=format(video.currentTime);

let duration=format(video.duration);

time.innerHTML=current+" / "+duration;

});

progress.addEventListener("input",()=>{

video.currentTime=(progress.value/100)*video.duration;

});

function format(sec){

if(isNaN(sec)) return "00:00";

let m=Math.floor(sec/60);

let s=Math.floor(sec%60);

if(m<10)m="0"+m;
if(s<10)s="0"+s;

return m+":"+s;

}

</script>

</body>
</html>
